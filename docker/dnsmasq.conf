# dnsmasqの設定ファイル
# dnsmasqはDNSプロキシとして、問い合わせのあったドメインのIPを解決しつつ、ipsetで指定されたドメインについては解決済みIPをipsetに追加する。

# 宛先IPが127.0.0.1のパケットのみ受け付ける（lo（コンテナのループバック用ネットワークインターフェース）経由の問い合わせだけが該当）。
listen-address=127.0.0.1
# listen-address:53をbindし、socketレベルで宛先がフィルターされる（既定は0.0.0.0:53をbindし宛先のフィルターはdnsmasqが実行する）
bind-interfaces
# 上記設定によりeth0（コンテナの外部通信用ネットワークインターフェース）アドレス宛のパケットはカーネルで破棄されるため、外部から到達可能なオープンリゾルバにならない。
# また、eth0に127.0.0.1宛のパケットが届いた場合もカーネルがmartianとして破棄するため、宛先を偽装しても到達できない。

# 既定では/etc/resolv.confのnameserverをプロキシ先DNSとして参照する。
# しかしそのファイルはentrypoint.shにより127.0.0.1（dnsmasq自身）を指すよう書き換えられるため、参照すると自分自身を参照するループになる。
# これを避けるためにそのファイルは参照せず、プロキシ先DNSは別途指定する。
no-resolv
#
# プロキシ先DNSの指定
# Cloudflare DNS
server=1.1.1.1
# Google Public DNS
server=8.8.8.8

# 許可ドメインを指定
# このドメインとそのサブドメインに対して解決されたIPはipsetへ追加される。ipsetに対するルール適用はentrypoint.shで実行する。
#
# 常に許可するドメイン
# api.anthropic.com、claude.ai: Claude へ接続するために必要
ipset=/api.anthropic.com/allowed-https
ipset=/claude.ai/allowed-https
#
# 追加で許可する接続先と、Docker組み込みDNSで解決するホストは、環境変数ALLOWED_ENDPOINTS・ALLOWED_DOCKER_DNSからentrypoint.shが生成する。
conf-file=/etc/dnsmasq-allowed-domains.conf
